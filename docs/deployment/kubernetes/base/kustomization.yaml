apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - service-account.yaml
  - network-policy.yaml
configMapGenerator:
  - name: keiro-console-config
    files:
      - Caddyfile
      - console-config.json
generatorOptions:
  immutable: true
