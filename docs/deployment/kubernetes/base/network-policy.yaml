# Replace namespace/pod labels and ports in a site overlay. Requires an enforcing CNI.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keiro-console
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keiro-console
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: applications
          podSelector:
            matchLabels:
              keiro-console-inspection: "true"
      ports:
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 9091
        - protocol: TCP
          port: 9095
        - protocol: TCP
          port: 9090
